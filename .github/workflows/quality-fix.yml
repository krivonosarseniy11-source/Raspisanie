name: Fix schedule data
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch schedule validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(!validNum(n)||!validSubject(s))continue;let subject=s.replace(/^[-–—]+\\s*/,'').trim();if(!validSubject(subject))continue;out[day][n]??={};out[day][n][c]={subject,room:r,teacher:t}", "if(!validNum(n)||!validSubject(s))continue;let subject=s.replace(/^[-–—]+\\s*/,'').trim();if(!validSubject(subject))continue;let key=clean(subject).toLowerCase();if(['предмет','название','урок','уроки'].includes(key))continue;out[day][n]??={};out[day][n][c]={subject,room:r,teacher:t}")
          s=s.replace("let c=localStorage.getItem('schedule48');if(c){data=JSON.parse(c);", "let c=localStorage.getItem('schedule48');if(c){data=JSON.parse(c);data=Object.fromEntries(DAYS.map(d=>[d,Object.fromEntries(Object.entries(data[d]||{}).filter(([n,b])=>validNum(n)).map(([n,b])=>[n,Object.fromEntries(Object.entries(b).filter(([c,e])=>e&&validSubject(e.subject)))]).filter(([n,b])=>Object.keys(b).length))]));")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Очистить статистику от записей без названия"
          git push