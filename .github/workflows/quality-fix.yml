name: Final schedule cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch schedule and search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="function validSubject(v){let s=clean(v);if(!s)return false;let x=s.toLowerCase().replace(/[–—−]/g,'-').replace(/\\.+$/,'').trim();if(!x||['-','—','–','нет','нет урока','нет уроков','урока нет','не проводится','не будет','n/a','na','null','undefined','- -','без названия','без названия урока','нет названия','название отсутствует','не указано','не указана','не указан'].includes(x))return false;if(/^[-_.\\s]+$/.test(x))return false;if(/^\\d+$/.test(x))return false;return true}"
          new="function validSubject(v){let s=clean(v);if(!s)return false;let x=s.toLowerCase().replace(/[–—−]/g,'-').replace(/[.,;:!?]+$/,'').trim();if(!x)return false;if(/^[-_.\\s]+$/.test(x)||/^\\d+$/.test(x))return false;const bad=['-','—','–','нет','нет урока','нет уроков','урока нет','не проводится','не будет','урок','урока','уроки','занятие','занятия','предмет','предметы','название','без названия','без названия урока','нет названия','название отсутствует','не указано','не указана','не указан','n/a','na','null','undefined','- -'];if(bad.includes(x))return false;if(/^(урок|занятие|предмет)(\\s*№?\\s*\\d+)?$/.test(x))return false;return true}"
          if old not in s: raise SystemExit('validSubject marker not found')
          s=s.replace(old,new,1)

          if 'function sanitizeData()' not in s:
              marker='function entries(d,c=chosen)'
              if marker not in s: raise SystemExit('entries marker not found')
              s=s.replace(marker,"function sanitizeData(){for(const d of DAYS){for(const n of Object.keys(data[d]||{})){if(!validNum(n)){delete data[d][n];continue}for(const c of Object.keys(data[d][n]||{})){let e=data[d][n][c];if(!e||!validSubject(e.subject))delete data[d][n][c]}if(!Object.keys(data[d][n]||{}).length)delete data[d][n]}}}function entries(d,c=chosen)",1)

          old_input='<input id="search" placeholder="Предмет, учитель, кабинет…">'
          new_input='<input id="search" type="search" name="schedule-search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-autocomplete="list" aria-controls="searchSuggestions" placeholder="Найти предмет, учителя или кабинет…"><div id="searchSuggestions" class="searchSuggest" role="listbox"></div>'
          if old_input in s: s=s.replace(old_input,new_input,1)

          css='''.search{position:relative}.searchSuggest{display:none;position:absolute;z-index:1000;left:5px;right:5px;top:calc(100% + 6px);max-height:300px;overflow:auto;background:var(--card);border:1px solid var(--li);border-radius:14px;box-shadow:0 12px 30px rgba(16,42,76,.16);padding:5px}.searchSuggest.show{display:block}.searchSuggest button{display:block;width:100%;border:0;background:transparent;color:var(--tx);text-align:left;padding:11px 12px;border-radius:10px;font-weight:700}.searchSuggest button:active,.searchSuggest button:hover{background:var(--bg)}@media(max-width:760px){.searchSuggest{left:0;right:0;top:calc(100% + 5px);max-height:260px}}'''
          if '.searchSuggest{' not in s: s=s.replace('</style>',css+'</style>',1)

          if 'function searchPool()' not in s:
              marker='function controls(){'
              if marker not in s: raise SystemExit('controls marker not found')
              js="function searchPool(){return [...new Set([...subjects,...teachers,...rooms,...classes,...DAYS])].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),'ru',{numeric:true}))}function renderSearchSuggestions(){let box=$('searchSuggestions'),q=clean($('search').value).toLowerCase();if(!box)return;let a=searchPool().filter(v=>!q||String(v).toLowerCase().includes(q)).slice(0,10);box.innerHTML=a.map(v=>'<button type=\"button\" role=\"option\" data-value=\"'+esc(v)+'\">'+esc(v)+'</button>').join('');box.classList.toggle('show',document.activeElement===$('search')&&a.length>0)}function hideSearchSuggestions(){let b=$('searchSuggestions');if(b)b.classList.remove('show')}"
              s=s.replace(marker,js+marker,1)

          s=s.replace("data=build(csv(await r.text()));if(!DAYS.includes(viewDay))","data=build(csv(await r.text()));sanitizeData();if(!DAYS.includes(viewDay))",1)
          s=s.replace("let c=localStorage.getItem('schedule48');if(c){data=JSON.parse(c);","let c=localStorage.getItem('schedule48');if(c){data=JSON.parse(c);sanitizeData();",1)

          marker="$('refresh').onclick=load;$('classSelect').onchange=e=>{chosen=e.target.value;localStorage.setItem('class48',chosen);renderMode();updateHeader()};"
          if marker not in s: raise SystemExit('handlers marker not found')
          extra="$('search').onfocus=renderSearchSuggestions;$('search').oninput=()=>{renderSearchSuggestions();doSearch()};$('search').onsearch=doSearch;$('searchSuggestions').onclick=e=>{let b=e.target.closest('button[data-value]');if(!b)return;$('search').value=b.dataset.value;hideSearchSuggestions();doSearch()};document.addEventListener('click',e=>{if(!e.target.closest('.search'))hideSearchSuggestions()});"
          s=s.replace(marker,marker+extra,1)
          s=s.replace("$('search').oninput=doSearch;",'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Исправить уроки без названия и поиск"
          git push
          rm -f .github/workflows/quality-fix.yml
          git add -u .github/workflows/quality-fix.yml
          git diff --cached --quiet || git commit -m "Удалить временный workflow"
          git push