name: Improve schedule UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI and validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function validSubject(v){let s=clean(v);if(!s)return false;let x=s.toLowerCase().replace(/[–—−]/g,'-').replace(/\.+$/,'').trim();if(!x||['-','—','–','нет','нет урока','нет уроков','урока нет','не проводится','не будет','n/a','na','null','undefined','- -'].includes(x))return false;if(/^[-_.\s]+$/.test(x))return false;if(/^\d+$/.test(x))return false;return true}"
          new="function validSubject(v){let s=clean(v);if(!s)return false;let x=s.toLowerCase().replace(/[–—−]/g,'-').replace(/[.,;:!?]+$/,'').trim();if(!x)return false;if(/^[-_.\s]+$/.test(x)||/^\d+$/.test(x))return false;const bad=['-','—','–','нет','нет урока','нет уроков','урок','урока','уроки','занятие','занятия','предмет','предметы','название','без названия','без названия урока','нет названия','название отсутствует','не указано','не указана','не указан','n/a','na','null','undefined','- -'];if(bad.includes(x))return false;if(/^(урок|занятие|предмет)(\s*№?\s*\d+)?$/.test(x))return false;return true}"
          if old not in s:
              raise SystemExit('validSubject pattern not found')
          s=s.replace(old,new,1)
          old_input='<input id="search" placeholder="Предмет, учитель, кабинет…">'
          new_input='<input id="search" type="search" autocomplete="off" list="searchSuggestions" placeholder="Найти предмет, учителя, кабинет…"><datalist id="searchSuggestions"></datalist>'
          if old_input not in s:
              raise SystemExit('search input pattern not found')
          s=s.replace(old_input,new_input,1)
          marker='function controls(){'
          inject="function refreshSearchSuggestions(){let a=[...new Set([...subjects,...teachers,...rooms,...classes,...DAYS])].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),'ru',{numeric:true}));$('searchSuggestions').innerHTML=a.map(v=>'<option value=\\\"'+esc(v)+'\\\">').join('')}"
          if 'function refreshSearchSuggestions' not in s:
              s=s.replace(marker,inject+marker,1)
          marker2="teachers=[...ts].sort((a,b)=>a.localeCompare(b,'ru'));rooms=[...rs].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));subjects=[...ss].sort((a,b)=>a.localeCompare(b,'ru'));return out}"
          repl2="teachers=[...ts].sort((a,b)=>a.localeCompare(b,'ru'));rooms=[...rs].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));subjects=[...ss].sort((a,b)=>a.localeCompare(b,'ru'));refreshSearchSuggestions();return out}"
          s=s.replace(marker2,repl2,1)
          old_cache="let c=localStorage.getItem('schedule48');if(c){data=JSON.parse(c);"
          new_cache="let c=localStorage.getItem('schedule48');if(c){data=JSON.parse(c);data=Object.fromEntries(DAYS.map(d=>[d,Object.fromEntries(Object.entries(data[d]||{}).filter(([n,b])=>validNum(n)).map(([n,b])=>[n,Object.fromEntries(Object.entries(b).filter(([c,e])=>e&&validSubject(e.subject)))]).filter(([n,b])=>Object.keys(b).length))]));"
          s=s.replace(old_cache,new_cache,1)
          s=s.replace("$('search').oninput=doSearch;","$('search').oninput=doSearch;$('search').onsearch=doSearch;",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Исправить пустые уроки и улучшить поиск"
          git push
