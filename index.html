<script>
const ID='1tGzeVcjc4gKja-uegpOFkvOW61I50SP3zPipSCfTxqY',SHEET='Лист1',TZ='Europe/Moscow',DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],DEFAULT='9 б',BELL={1:['08:00','08:45',10],2:['08:55','09:40',10],3:['09:50','10:35',10],4:['10:45','11:30',15],5:['11:45','12:30',10],6:['12:40','13:25',10],7:['13:35','14:20',10],8:['14:30','15:15',0]};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={},classes=[],chosen=localStorage.getItem('class48')||DEFAULT,day=localStorage.getItem('day48')||'',currentPage=localStorage.getItem('page48')||'schedule';
function parts(){const a=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date()),o={};a.forEach(x=>o[x.type]=x.value);return o}
function todayIndex(){return ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(parts().weekday)}function todayName(){const i=todayIndex();return i>=0&&i<6?DAYS[i]:''}function nowHM(){const p=parts();return p.hour+':'+p.minute}function nowClock(){const p=parts();return parts().hour+':'+parts().minute+':'+parts().second}function mins(s){const a=String(s).split(':').map(Number);return a[0]*60+a[1]}function fmtMin(n){n=Math.max(0,Math.round(n));return n<60?n+' мин':Math.floor(n/60)+' ч '+n%60+' мин'}
function csv(t){let a=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);a.push(r);r=[];f=''}else if(c!=='\r')f+=c}if(f||r.length){r.push(f);a.push(r)}return a}
function clean(v){return String(v??'').replace(/\u00a0/g,' ').trim().replace(/\s+/g,' ')}
function validSubject(v){const s=clean(v),x=s.toLowerCase().replace(/[–—−]/g,'-').replace(/[.,;:!?]+$/,'').trim();if(!x||/^[-_.\s]+$/.test(x)||/^\d+$/.test(x))return false;const bad=['-','нет','нет урока','нет уроков','урока нет','не проводится','не будет','урок','урока','уроки','занятие','занятия','предмет','предметы','название','без названия','без названия урока','нет названия','название отсутствует','не указано','не указана','не указан','n/a','na','null','undefined','- -'];return !bad.includes(x)&&!(/^(урок|занятие|предмет)(\s*№?\s*\d+)?$/.test(x))}
function validNum(v){const n=Number(clean(v));return Number.isInteger(n)&&n>=1&&n<=8}function realLesson(n,e){return validNum(n)&&e&&validSubject(e.subject)}
function sanitize(src){const out={};DAYS.forEach(d=>{out[d]={};for(const [n,b] of Object.entries(src[d]||{})){if(!validNum(n))continue;for(const [c,e] of Object.entries(b||{}))if(realLesson(n,e))(out[d][n]??={})[c]={subject:clean(e.subject),room:clean(e.room),teacher:clean(e.teacher)}}});return out}
function build(rows){const h=rows[0]||[],map={};h.forEach((v,i)=>{const k=clean(v);if(/^\d{1,2}\s*[А-Яа-яЁё]$/.test(k))map[k]={n:i-1,s:i,r:i+1,t:i+2}});classes=Object.keys(map);if(!classes.includes(chosen))chosen=classes[0]||DEFAULT;const out={};DAYS.forEach(d=>out[d]={});let d='';for(let i=1;i<rows.length;i++){const row=rows[i]||[],first=clean(row[0]);if(DAYS.includes(first)){d=first;continue}if(!d)continue;for(const c of classes){const p=map[c],n=clean(row[p.n]),s=clean(row[p.s]),r=clean(row[p.r]),t=clean(row[p.t]);if(validNum(n)&&validSubject(s)){const subject=s.replace(/^[-–—]+\s*/,'').trim();if(validSubject(subject))(out[d][n]??={})[c]={subject,room:r,teacher:t}}}}return sanitize(out)}
function entries(d,c=chosen){return Object.entries(data[d]||{}).map(([n,b])=>({n:Number(n),e:b[c]})).filter(x=>realLesson(x.n,x.e)&&BELL[x.n]).sort((a,b)=>a.n-b.n)}
function findAt(d,t){const m=mins(t),arr=entries(d);for(const x of arr){const b=BELL[x.n];if(m>=mins(b[0])&&m<mins(b[1]))return{type:'lesson',x,b}}for(let i=1;i<=8;i++){const start=mins(BELL[i][0]),end=i<8?mins(BELL[i+1][0]):mins(BELL[8][1]);if(m>=mins(BELL[i][1])&&m<end)return{type:'break',end}}return{type:'after'}}

function updateHeader(){const d=todayName(),t=nowHM();$('clock').textContent=nowClock();$('dayName').textContent=d||'Воскресенье';$('dateText').textContent=new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,day:'numeric',month:'long',year:'numeric'}).format(new Date());if(!d){$('nowSubject').textContent='Сегодня воскресенье';$('nowTeacher').textContent='';$('nowRoom').textContent='';$('nowTime').textContent='';$('remain').textContent='Учебных занятий нет';$('progress').style.width='0';return}const q=findAt(d,t);if(q.type==='lesson'){const e=q.x.e,b=q.b,p=(mins(t)-mins(b[0]))/(mins(b[1])-mins(b[0]))*100;$('nowSubject').textContent=e.subject;$('nowTeacher').textContent=e.teacher||'';$('nowRoom').textContent=e.room?'Каб. '+e.room:'';$('nowTime').textContent=b[0]+'–'+b[1];$('progress').style.width=Math.max(0,Math.min(100,p))+'%';$('remain').textContent='До конца урока: '+fmtMin(mins(b[1])-mins(t))}else if(q.type==='break'){$('nowSubject').textContent='Перемена';$('nowTeacher').textContent='';$('nowRoom').textContent='';$('nowTime').textContent='';$('progress').style.width='0';$('remain').textContent='До конца перемены: '+fmtMin(q.end-mins(t))}else{$('nowSubject').textContent='Уроков сейчас нет';$('nowTeacher').textContent='';$('nowRoom').textContent='';$('nowTime').textContent='';$('progress').style.width='0';$('remain').textContent='На сегодня уроков больше нет'}renderNext()}
function renderNext(){const d=todayName();if(!d){$('nextSubject').textContent='Учебная неделя закончилась';$('nextInfo').textContent='Следующий учебный день — понедельник';$('nextCount').textContent='✓';return}const m=mins(nowHM()),x=entries(d).find(x=>mins(BELL[x.n][0])>m);if(!x){$('nextSubject').textContent='Уроков больше нет';$('nextInfo').textContent='На сегодня всё';$('nextCount').textContent='✓';return}const b=BELL[x.n];$('nextSubject').textContent=x.e.subject;$('nextInfo').textContent=(x.e.teacher?x.e.teacher+' · ':'')+(x.e.room?'каб. '+x.e.room+' · ':'')+b[0]+'–'+b[1];$('nextCount').textContent='через '+fmtMin(mins(b[0])-m)}
function timeline(){const arr=entries(day),today=day===todayName(),m=mins(nowHM());$('scheduleTitle').textContent='Расписание · '+day.toLowerCase();if(!arr.length){$('timeline').innerHTML='<div class="empty">На этот день для '+esc(chosen)+' класса нет заполненных уроков.</div>';return}$('timeline').innerHTML=arr.map(x=>{const b=BELL[x.n],st=today?(m>=mins(b[1])?'done':m>=mins(b[0])?'current':''):'';return '<div class="lesson '+st+'"><div class="ltime">'+b[0]+'<br>'+b[1]+'</div><div class="rail"><i></i></div><div class="box"><div class="num">УРОК '+x.n+'</div><div class="subj">'+esc(x.e.subject)+'</div>'+(x.e.teacher?'<div class="teacher">'+esc(x.e.teacher)+'</div>':'')+(x.e.room?'<span class="tag">КАБ. '+esc(x.e.room)+'</span>':'')+(st==='current'?'<span class="tag green">СЕЙЧАС</span>':'')+'</div></div>'+(b[2]?'<div class="break">Перемена · '+b[2]+' мин</div>':'')}).join('')}
function renderWeek(){const html=DAYS.map(d=>'<div class="week-row"><b>'+d+'</b>'+((entries(d).map(x=>'<div style="margin-top:9px"><b>'+x.n+'. '+esc(x.e.subject)+'</b><small>'+BELL[x.n][0]+'–'+BELL[x.n][1]+(x.e.room?' · каб. '+esc(x.e.room):'')+'</small></div>').join(''))||'<div class="empty">Нет заполненных уроков</div>')+'</div>').join('');$('weekGrid').innerHTML=html}
function renderStats(){const all=DAYS.flatMap(d=>entries(d)),today=todayName()?entries(todayName()):[],total=all.reduce((s,x)=>s+mins(BELL[x.n][1])-mins(BELL[x.n][0]),0),remain=today.filter(x=>mins(BELL[x.n][1])>mins(nowHM())).length;$('stToday').textContent=today.length;$('stWeek').textContent=all.length;$('stHours').textContent=Math.floor(total/60)+' ч';$('stRemain').textContent=remain;const cnt={};all.forEach(x=>cnt[x.e.subject]=(cnt[x.e.subject]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]),max=top[0]?.[1]||1;$('subjectStats').innerHTML=top.length?'<b style="font-size:13px">Предметы за неделю</b>'+top.slice(0,10).map(([s,n])=>'<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800"><span>'+esc(s)+'</span><span>'+n+'</span></div><div class="statbar"><i style="width:'+(n/max*100)+'%"></i></div></div>').join(''):'<div class="empty">Нет реальных уроков</div>';const days=DAYS.map(d=>[d,entries(d).length]).sort((a,b)=>b[1]-a[1]);$('busyDay').textContent=days[0]?.[1]?'Самый загруженный день — '+days[0][0]+' ('+days[0][1]+' уроков)':'Самый загруженный день — —'}
function search(){const q=clean($('searchInput').value).toLowerCase();if(!q){$('searchResults').innerHTML='<div class="empty">Начните вводить предмет, учителя или кабинет.</div>';return}let r='';for(const d of DAYS)for(const x of entries(d))if([d,x.n,x.e.subject,x.e.teacher,x.e.room].join(' ').toLowerCase().includes(q))r+='<div class="result"><b>'+d+' · урок '+x.n+' · '+esc(x.e.subject)+'</b><small>'+BELL[x.n][0]+'–'+BELL[x.n][1]+(x.e.teacher?' · '+esc(x.e.teacher):'')+(x.e.room?' · каб. '+esc(x.e.room):'')+'</small></div>';$('searchResults').innerHTML=r||'<div class="empty">Ничего не найдено.</div>'}
function showPage(p){currentPage=p;localStorage.setItem('page48',p);document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+p));document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p==='schedule')timeline();if(p==='week')renderWeek();if(p==='stats')renderStats();if(p==='search')search()}
async function load(){try{const u='https://docs.google.com/spreadsheets/d/'+ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(SHEET)+'&_='+Date.now(),r=await fetch(u);if(!r.ok)throw Error();data=build(csv(await r.text()));controls();localStorage.setItem('schedule48',JSON.stringify(data));localStorage.setItem('dataUpdated48',Date.now());showPage(currentPage);updateHeader();$('status').textContent='Данные обновлены · пустые уроки исключены';$('updated').textContent='сейчас'}catch(e){try{const c=localStorage.getItem('schedule48');if(!c)throw Error();data=sanitize(JSON.parse(c));classes=Object.keys(new Set());controls();showPage(currentPage);updateHeader();$('status').textContent='Офлайн · сохранённая копия'}catch(_){$('status').textContent='Не удалось загрузить расписание'}}}
$('refresh').onclick=load;$('classSelect').onchange=e=>{chosen=e.target.value;localStorage.setItem('class48',chosen);controls();updateHeader();showPage(currentPage)};$('settingsClass').onchange=e=>{chosen=e.target.value;localStorage.setItem('class48',chosen);controls();updateHeader();showPage('schedule')};$('searchInput').oninput=search;$('themeBtn').textContent=localStorage.getItem('theme48')==='dark'?'☀️ Светлая тема':'🌙 Тёмная тема';$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');localStorage.setItem('theme48',d?'dark':'light');$('themeBtn').textContent=d?'☀️ Светлая тема':'🌙 Тёмная тема'};$('clearCache').onclick=()=>{localStorage.removeItem('schedule48');localStorage.removeItem('dataUpdated48');load()};$('notifyBtn').onclick=async()=>{if('Notification' in window){const p=await Notification.requestPermission();if(p==='granted')new Notification('Расписание',{body:'Уведомления включены'})}};document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>showPage(b.dataset.page));document.body.classList.toggle('dark',localStorage.getItem('theme48')==='dark');load();setInterval(()=>{updateHeader();if(currentPage==='schedule')timeline();if(currentPage==='stats')renderStats()},1000);setInterval(load,300000);
</script>
</body>
</html>
