<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Расписание — Лицей №48</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface2:#eef3f9;--text:#111827;--muted:#64748b;--line:#dbe3ee;--primary:#2563eb;--primary2:#1d4ed8;--dark:#0b1220;--green:#16a34a;--shadow:0 10px 30px rgba(15,23,42,.08);--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1280px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#0b1220 0%,#172554 55%,#2563eb 100%);color:#fff;border-radius:24px;padding:24px 24px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.top:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;top:-160px;background:rgba(255,255,255,.08)}.brand{position:relative;z-index:1;display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800;font-size:20px;border:1px solid rgba(255,255,255,.18)}h1{font-size:clamp(24px,4vw,38px);line-height:1.05;margin:0;font-weight:850;letter-spacing:-.04em}.sub{margin:7px 0 0;color:#cbd5e1;font-size:13px}.date{position:relative;z-index:1;margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.date strong{font-size:16px}.status{display:inline-flex;align-items:center;gap:8px;color:#dbeafe;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;box-shadow:0 0 0 4px rgba(251,191,36,.14)}.dot.live{background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.14)}.dot.error{background:#fb7185}.toolbar{position:sticky;top:0;z-index:10;margin:14px 0;background:rgba(244,247,251,.88);backdrop-filter:blur(14px);padding:4px 0}.modes{display:flex;gap:8px;overflow:auto;padding:4px 1px;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}.mode{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:11px 15px;border-radius:13px;white-space:nowrap;font-weight:750;font-size:13px;cursor:pointer;transition:.18s}.mode:hover{border-color:#b9c8dc;color:var(--text)}.mode.active{background:var(--dark);color:#fff;border-color:var(--dark)}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.control{display:none}.control.active{display:flex}.select,input{height:44px;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:0 13px;color:var(--text);font:600 14px inherit;outline:none;min-width:180px;box-shadow:0 2px 8px rgba(15,23,42,.03)}select:focus,input:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(37,99,235,.1)}.label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}.table-scroll{overflow:auto}.schedule{width:100%;border-collapse:separate;border-spacing:0;min-width:850px}.schedule th{position:sticky;top:0;background:#f8fafc;color:#475569;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:14px 13px;border-bottom:1px solid var(--line);white-space:nowrap}.schedule th:first-child{width:105px;text-align:center}.schedule td{padding:10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;background:#fff;min-width:150px}.schedule tr:last-child td{border-bottom:0}.schedule td:last-child,.schedule th:last-child{border-right:0}.lesson{background:linear-gradient(180deg,#0f172a,#172554)!important;color:#fff!important;text-align:center;min-width:105px!important}.lesson .n{display:block;font-size:24px;font-weight:850;color:#93c5fd}.lesson .time{display:block;margin-top:2px;font-size:11px;color:#cbd5e1;font-weight:650}.lesson .break{display:inline-block;margin-top:7px;font-size:9px;color:#93c5fd}.cell{min-height:64px}.subject{font-weight:800;font-size:14px;line-height:1.2;color:#1d4ed8}.teacher{font-size:12px;color:#64748b;margin-top:5px}.room{display:inline-block;margin-top:7px;background:#eff6ff;color:#1d4ed8;border:1px solid #dbeafe;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:800}.klass{display:inline-block;margin-bottom:6px;background:#f1f5f9;color:#334155;border-radius:7px;padding:3px 7px;font-size:10px;font-weight:850}.empty{text-align:center;color:#cbd5e1;font-size:18px;padding-top:20px!important}.sep{border:0;border-top:1px dashed #dbe3ee;margin:10px 0}.loading{padding:60px 20px;text-align:center;color:var(--muted)}.loading b{display:block;color:var(--text);margin-bottom:5px}.footer{margin:18px 0 4px;text-align:center;color:#94a3b8;font-size:11px}.error{margin-bottom:12px;padding:12px 14px;border-radius:13px;background:#fff1f2;border:1px solid #fecdd3;color:#be123c;font-size:13px;line-height:1.4}.refresh{margin-left:auto;border:0;background:var(--primary);color:#fff;height:44px;padding:0 15px;border-radius:13px;font-weight:800;cursor:pointer}.refresh:hover{background:var(--primary2)}@media(max-width:700px){.app{padding:10px}.top{border-radius:20px;padding:20px 18px 18px}.brand{gap:11px}.logo{width:45px;height:45px;border-radius:13px}.sub{font-size:12px}.toolbar{margin:10px 0}.controls{gap:7px}.control{width:100%}.select,input{flex:1;min-width:0;width:100%}.refresh{width:100%;margin:0}.card{border-radius:15px}.schedule td{padding:8px}.schedule th{padding:12px 9px}.subject{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">48</div><div><h1>Расписание</h1><div class="sub">Лицей №48 им. А. В. Суворова · Краснодар</div></div></div>
  <div class="date"><strong>1 смена</strong><span class="status"><i class="dot" id="dot"></i><span id="status">Загрузка расписания…</span></span></div>
</header>
<div class="toolbar">
  <nav class="modes" id="modes">
    <button class="mode active" data-mode="class">По классам</button><button class="mode" data-mode="teacher">По учителям</button><button class="mode" data-mode="room">По кабинетам</button><button class="mode" data-mode="subject">По предметам</button><button class="mode" data-mode="time">По времени</button>
  </nav>
  <div class="controls">
    <div class="control active" id="ctrl-class"><span class="label">Класс</span><select id="classSelect"></select></div>
    <div class="control" id="ctrl-teacher"><span class="label">Учитель</span><input list="teacherList" id="teacherInput" placeholder="Начните вводить фамилию"><datalist id="teacherList"></datalist></div>
    <div class="control" id="ctrl-room"><span class="label">Кабинет</span><select id="roomSelect"></select></div>
    <div class="control" id="ctrl-subject"><span class="label">Предмет</span><select id="subjectSelect"></select></div>
    <div class="control" id="ctrl-time"><span class="label">День</span><select id="daySelect"></select><span class="label">Урок</span><select id="lessonSelect"></select></div>
    <button class="refresh" id="refreshBtn">Обновить</button>
  </div>
</div>
<div id="error"></div>
<section class="card"><div class="table-scroll"><table class="schedule"><thead id="thead"></thead><tbody id="tbody"><tr><td colspan="7"><div class="loading"><b>Загрузка…</b>Получаем актуальное расписание</div></td></tr></tbody></table></div></section>
<footer class="footer">Знания · Честь · Отечество · Лицей №48</footer>
</div>
<script>
const SHEET_ID='1tGzeVcjc4gKja-uegpOFkvOW61I50SP3zPipSCfTxqY',SHEET_NAME='Лист1',DAY_ORDER=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],CLASS_RE=/^\d{1,2}\s*[А-Яа-яЁё]$/,DEFAULT_CLASS='9 б';
const BELL={1:['08:00–08:45','10 мин'],2:['08:55–09:40','10 мин'],3:['09:50–10:35','10 мин'],4:['10:45–11:30','15 мин'],5:['11:45–12:30','10 мин'],6:['12:40–13:25','10 мин'],7:['13:35–14:20','10 мин'],8:['14:30–15:15','']};
let classMap={},data={},teachers=new Set(),rooms=new Set(),subjects=new Set(),mode='class',currentClass=DEFAULT_CLASS,currentTeacher='',currentRoom='',currentSubject='',currentDay='Понедельник',currentLesson='1';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function csv(t){let R=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!=='\r')f+=c}if(f.length||r.length){r.push(f);R.push(r)}return R}
function build(rows){classMap={};(rows[0]||[]).forEach((x,i)=>{x=(x||'').trim();if(CLASS_RE.test(x))classMap[x]={lesson:i-1,subject:i,room:i+1}});let out={},refs={},day=null;for(let r=1;r<rows.length;r++){let row=rows[r],dn=(row[0]||'').trim();if(DAY_ORDER.includes(dn)){day=dn;out[day]??={};refs={}}if(!day)continue;for(const c in classMap){let p=classMap[c],n=(row[p.lesson]||'').trim(),s=(row[p.subject]||'').trim(),rm=(row[p.room]||'').trim();if(n){out[day][n]??={};let e={subject:s,room:rm,teacher:''};out[day][n][c]=e;refs[c]=e;if(s)subjects.add(s);if(rm)rooms.add(rm)}else if(s&&refs[c]&&!refs[c].teacher){refs[c].teacher=s;teachers.add(s)}}}return out}
function fill(el,arr,val){el.innerHTML='';arr.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;if(v===val)o.selected=true;el.appendChild(o)})}
function controls(){let cs=Object.keys(classMap);if(!cs.includes(currentClass))currentClass=cs[0]||'';fill($('classSelect'),cs,currentClass);$('teacherList').innerHTML='';[...teachers].sort((a,b)=>a.localeCompare(b,'ru')).forEach(v=>{let o=document.createElement('option');o.value=v;$('teacherList').appendChild(o)});let rs=[...rooms].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));currentRoom=currentRoom&&rs.includes(currentRoom)?currentRoom:rs[0]||'';fill($('roomSelect'),rs,currentRoom);let ss=[...subjects].sort((a,b)=>a.localeCompare(b,'ru'));currentSubject=currentSubject&&ss.includes(currentSubject)?currentSubject:ss[0]||'';fill($('subjectSelect'),ss,currentSubject);fill($('daySelect'),DAY_ORDER,currentDay);fill($('lessonSelect'),Object.keys(BELL),currentLesson)}
function head(){return `<tr><th>Урок</th>${DAY_ORDER.map(x=>`<th>${x}</th>`).join('')}</tr>`}
function cell(c,e){return `<div class="cell">${c?`<span class="klass">${esc(c)}</span>`:''}<div class="subject">${esc(e.subject||'—')}</div>${e.teacher?`<div class="teacher">${esc(e.teacher)}</div>`:''}${e.room?`<span class="room">№${esc(e.room)}</span>`:''}</div>`}
function grid(filter,fn=cell){$('thead').innerHTML=head();let h='';for(let n=1;n<=8;n++){let b=BELL[n];h+=`<tr><td class="lesson"><span class="n">${n}</span><span class="time">${b[0]}</span>${b[1]?`<span class="break">перемена ${b[1]}</span>`:''}</td>`;for(const d of DAY_ORDER){let a=Object.entries(data[d]?.[n]||{}).filter(([c,e])=>filter(c,e));h+=`<td>${a.length?a.map(([c,e])=>fn(c,e)).join('<hr class="sep">'):'<div class="empty">—</div>'}</td>`}h+='</tr>'}$('tbody').innerHTML=h}
function render(){if(mode==='class')grid(c=>c===currentClass,(c,e)=>cell('',e));else if(mode==='teacher')grid((c,e)=>e.teacher===currentTeacher);else if(mode==='room')grid((c,e)=>e.room===currentRoom);else if(mode==='subject')grid((c,e)=>e.subject===currentSubject);else{let b=data[currentDay]?.[currentLesson]||{};$('thead').innerHTML='<tr><th>Класс</th><th>Предмет</th><th>Учитель</th><th>Кабинет</th></tr>';$('tbody').innerHTML=Object.keys(classMap).map(c=>{let e=b[c];return `<tr><td><span class="klass">${esc(c)}</span></td><td>${e?.subject?`<span class="subject">${esc(e.subject)}</span>`:'—'}</td><td>${e?.teacher?esc(e.teacher):'—'}</td><td>${e?.room?'№'+esc(e.room):'—'}</td></tr>`}).join('')}}
function status(s,t){$('status').textContent=t;$('dot').className='dot '+s}
async function load(){status('','Обновление…');$('error').innerHTML='';try{let u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`,r=await fetch(u);if(!r.ok)throw Error(r.status);teachers=new Set();rooms=new Set();subjects=new Set();data=build(csv(await r.text()));controls();render();status('live','Данные обновлены · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}))}catch(e){status('error','Не удалось обновить');$('error').innerHTML='<div class="error">Не удалось загрузить расписание. Проверьте доступ к Google Таблице или нажмите «Обновить» ещё раз.</div>'}}
$('modes').addEventListener('click',e=>{let b=e.target.closest('.mode');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.control').forEach(x=>x.classList.remove('active'));$('ctrl-'+mode).classList.add('active');render()});
$('classSelect').onchange=e=>{currentClass=e.target.value;render()};$('teacherInput').oninput=e=>{currentTeacher=e.target.value.trim();render()};$('roomSelect').onchange=e=>{currentRoom=e.target.value;render()};$('subjectSelect').onchange=e=>{currentSubject=e.target.value;render()};$('daySelect').onchange=e=>{currentDay=e.target.value;render()};$('lessonSelect').onchange=e=>{currentLesson=e.target.value;render()};$('refreshBtn').onclick=load;load();setInterval(load,300000);
</script>
</body>
</html>
