  .crest { position: relative; z-index: 2; display: block; width: 58px; height: auto; margin: 0 auto 4px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55)); }
  .eyebrow { position: relative; z-index: 2; color: var(--white); font-size: 11.5px; letter-spacing: 0.08em; opacity: 0.95; margin: 0 0 4px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  h1 {
    position: relative; z-index: 2;
    font-family: 'Palatino Linotype', Georgia, serif;
    font-weight: 700;
    font-size: clamp(22px, 5.5vw, 36px);
    color: var(--white);
    margin: 0 0 6px;
    text-shadow: 0 2px 6px rgba(7,24,47,0.7);
  }
  .gold-rule { position: relative; z-index: 2; width: 70px; height: 2px; background: var(--gold); margin: 0 auto 10px; opacity: 0.85; }
  .atom-badge { position: relative; z-index: 2; width: 78px; height: auto; margin: 8px auto 0; display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }

  .mode-switch {
    display: flex;
    flex-wrap: wrap;
    background: var(--navy2);
    padding: 6px;
    gap: 5px;
    border-top: 1px solid rgba(201,154,62,0.3);
  }
  .mode-switch button {
    flex: 1 1 auto;
    min-width: 92px;
    padding: 8px 5px;
    border: none;
    border-radius: 3px;
    background: transparent;
    color: var(--white);
    font-family: Georgia, serif;
    font-size: 12.5px;
    cursor: pointer;
    opacity: 0.75;
  }
  .mode-switch button:hover { background: rgba(201,154,62,0.15); opacity: 1; }
  .mode-switch button.active {
    background: var(--royal);
    opacity: 1;
    font-weight: bold;
  }

  .controls {
    background: var(--navy2);
    padding: 10px 16px;
    display: none;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 1px solid rgba(201,154,62,0.2);
  }
  .controls.active { display: flex; }
  .controls label { color: var(--white); font-size: 13px; white-space: nowrap; }
  .controls select, .controls input {
    font-family: Georgia, serif;
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 3px;
    border: 1px solid var(--navy);
    background: var(--light);
    color: var(--navy);
    flex: 1;
    min-width: 110px;
  }
  .controls select:focus, .controls input:focus { outline: none; border-color: var(--gold); }

  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    padding: 6px 16px; background: var(--navy); color: var(--white); font-size: 11.5px;
  }
  .status-bar button {
    background: var(--royal); color: var(--white); border: 1px solid var(--gold);
    border-radius: 3px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; font-family: Georgia, serif;
  }
  .status-bar button:hover { background: var(--navy2); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 6px; }
  .status-dot.live { background: var(--royal); }
  .status-dot.error { background: var(--red); }

  .error-banner {
    display: none; background: var(--red); color: var(--white);
    font-size: 12.5px; padding: 10px 16px; line-height: 1.4;
  }
  .error-banner.show { display: block; }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; min-width: 780px; border-collapse: collapse; }
  thead th {
    background: var(--navy2); color: var(--white); font-size: 14px; font-weight: normal;
    padding: 10px 8px; border: 1px solid var(--navy); text-align: center;
  }
  thead th.num-col { background: var(--navy); width: 90px; border-bottom: 2px solid var(--gold); }
  tbody td {
    border: 1px solid var(--muted); padding: 8px 8px; vertical-align: top;
    font-size: 13px; line-height: 1.35; background: var(--light); color: var(--navy);
  }
  tr:nth-child(even) td { background: var(--white); }
  .num-cell { text-align: center; background: var(--navy) !important; color: var(--white); font-weight: bold; }
  .num-cell .n { font-size: 20px; display: block; color: var(--gold); }
  .num-cell .time { font-size: 11px; display: block; margin-top: 2px; }
  .num-cell .break { font-size: 10px; color: var(--gold); display: block; margin-top: 3px; font-style: italic; }
  .subject { font-weight: bold; color: var(--royal); display: block; margin-bottom: 2px; }
  .teacher { display: block; color: var(--navy); font-size: 12px; }
  .klass-tag {
    display: inline-block; font-size: 10.5px; color: var(--navy);
    background: var(--gold); padding: 0 5px; border-radius: 3px; margin-bottom: 2px;
  }
  .room {
    display: inline-block; margin-top: 4px; font-size: 11px;
    color: var(--navy); background: var(--gold); padding: 1px 7px; border-radius: 3px; font-weight: bold;
  }
  .empty { text-align: center; color: var(--muted); }
  .loading-row td { text-align: center; padding: 30px; color: var(--navy2); font-style: italic; }

<script>
const SHEET_ID = '1tGzeVcjc4gKja-uegpOFkvOW61I50SP3zPipSCfTxqY';
const SHEET_NAME = 'Лист1';
const COL_DAY = 0;
const DAY_ORDER = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const CLASS_LABEL_RE = /^\d{1,2}\s*[А-Яа-яЁё]$/;
const DEFAULT_CLASS = '9 б';

const BELL_TIMES = {
  '1': { time: '08:00–08:45', brk: 'перемена 10 мин' },
  '2': { time: '08:55–09:40', brk: 'перемена 10 мин' },
  '3': { time: '09:50–10:35', brk: 'перемена 10 мин' },
  '4': { time: '10:45–11:30', brk: 'перемена 15 мин' },
  '5': { time: '11:45–12:30', brk: 'перемена 10 мин' },
  '6': { time: '12:40–13:25', brk: 'перемена 10 мин' },
  '7': { time: '13:35–14:20', brk: 'перемена 10 мин' },
  '8': { time: '14:30–15:15', brk: '' }
};

const GRID_THEAD = `<tr>
  <th class="num-col">№ урока</th>
  <th>Понедельник</th><th>Вторник</th><th>Среда</th>
  <th>Четверг</th><th>Пятница</th><th>Суббота</th>
</tr>`;
const TIME_THEAD = `<tr>
  <th>Класс</th><th>Предмет</th><th>Учитель</th><th>Кабинет</th>
</tr>`;

let classMap = {};
let scheduleData = {};
let teacherSet = new Set();
let roomSet = new Set();
let subjectSet = new Set();
let mode = 'class';
let currentClass = DEFAULT_CLASS;
let currentTeacher = '';
let currentRoom = '';
let currentSubject = '';
let currentDay = DAY_ORDER[0];
let currentLesson = '1';

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function detectClassColumns(headerRow) {
  const map = {};
  headerRow.forEach((cell, idx) => {
    const val = (cell || '').trim();
    if (CLASS_LABEL_RE.test(val)) {
      map[val] = { lessonCol: idx - 1, subjectCol: idx, roomCol: idx + 1 };
    }
  });
  return map;
}

function buildSchedule(rows) {
  const header = rows[0] || [];
  classMap = detectClassColumns(header);
  const days = {};
  const currentLessonRefs = {};
  let day = null;

  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const dayName = (row[COL_DAY] || '').trim();
    if (dayName && DAY_ORDER.includes(dayName)) {
      day = dayName;
      if (!days[day]) days[day] = {};
      Object.keys(classMap).forEach(k => { currentLessonRefs[k] = null; });
    }
    if (!day) continue;

    Object.keys(classMap).forEach(className => {
      const cols = classMap[className];
      const lessonNum = (row[cols.lessonCol] || '').trim();
      const subject = (row[cols.subjectCol] || '').trim();
      const room = (row[cols.roomCol] || '').trim();

      if (lessonNum) {
        if (!days[day][lessonNum]) days[day][lessonNum] = {};
        const entry = { subject, room, teacher: '' };
        days[day][lessonNum][className] = entry;
        currentLessonRefs[className] = entry;
        if (subject) subjectSet.add(subject);
        if (room) roomSet.add(room);
      } else if (subject && currentLessonRefs[className] && !currentLessonRefs[className].teacher) {
        currentLessonRefs[className].teacher = subject;
        teacherSet.add(subject);
      }
    });
  }
  return days;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fillSelect(select, values, current) {
  select.innerHTML = '';
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    if (v === current) opt.selected = true;
    select.appendChild(opt);
  });
}

function populateControls() {
  const classNames = Object.keys(classMap);
  if (!classNames.includes(currentClass) && classNames.length) currentClass = classNames[0];
  fillSelect(document.getElementById('classSelect'), classNames, currentClass);

  const teacherList = document.getElementById('teacherList');
  teacherList.innerHTML = '';
  Array.from(teacherSet).sort((a,b)=>a.localeCompare(b,'ru')).forEach(name => {
    const opt = document.createElement('option'); opt.value = name; teacherList.appendChild(opt);
  });

  const rooms = Array.from(roomSet).sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));
  if (!currentRoom && rooms.length) currentRoom = rooms[0];
  fillSelect(document.getElementById('roomSelect'), rooms, currentRoom);

  const subjects = Array.from(subjectSet).sort((a,b)=>a.localeCompare(b,'ru'));
  if (!currentSubject && subjects.length) currentSubject = subjects[0];
  fillSelect(document.getElementById('subjectSelect'), subjects, currentSubject);

  fillSelect(document.getElementById('daySelect'), DAY_ORDER, currentDay);
  fillSelect(document.getElementById('lessonSelect'), Object.keys(BELL_TIMES), currentLesson);
}

// generic grid renderer: filterFn(className, entry) -> bool, cellHtmlFn(className, entry) -> html
function renderGrid(filterFn, cellHtmlFn) {
  document.getElementById('thead').innerHTML = GRID_THEAD;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  for (let n = 1; n <= 8; n++) {
    const num = String(n);
    const bell = BELL_TIMES[num] || { time: '', brk: '' };
    const tr = document.createElement('tr');
    const numTd = document.createElement('td');
    numTd.className = 'num-cell';
    numTd.innerHTML = `<span class="n">${num}</span><span class="time">${bell.time}</span>` +
      (bell.brk ? `<span class="break">${bell.brk}</span>` : '');
    tr.appendChild(numTd);

    DAY_ORDER.forEach(day => {
      const bucket = (scheduleData[day] && scheduleData[day][num]) ? scheduleData[day][num] : {};
      const matches = Object.keys(bucket)
        .map(className => ({ className, entry: bucket[className] }))
        .filter(({ className, entry }) => filterFn(className, entry));
      const td = document.createElement('td');
      if (matches.length) {
        td.innerHTML = matches.map(({ className, entry }) => cellHtmlFn(className, entry)).join('<hr class="sep">');
      } else {
        td.className = 'empty';
        td.textContent = '—';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
}

function renderClassView() {
  if (!currentClass) { renderEmptyMsg('Класс не найден.'); return; }
  renderGrid(
    (className) => className === currentClass,
    (className, entry) => entry.subject
      ? `<span class="subject">${escapeHtml(entry.subject)}</span>` +
        (entry.teacher ? `<span class="teacher">${escapeHtml(entry.teacher)}</span>` : '') +
        (entry.room ? `<span class="room">№${escapeHtml(entry.room)}</span>` : '')
      : ''
  );
}

function renderTeacherView() {
  if (!currentTeacher) { renderEmptyMsg('Введите фамилию учителя выше, чтобы увидеть его занятия.'); return; }
  renderGrid(
    (className, entry) => entry.teacher === currentTeacher,
    (className, entry) => `<span class="klass-tag">${escapeHtml(className)}</span>` +
      `<span class="subject">${escapeHtml(entry.subject)}</span>` +
      (entry.room ? `<span class="room">№${escapeHtml(entry.room)}</span>` : '')
  );
}

function renderRoomView() {
  if (!currentRoom) { renderEmptyMsg('Кабинеты не найдены.'); return; }
  renderGrid(
    (className, entry) => entry.room === currentRoom,
    (className, entry) => `<span class="klass-tag">${escapeHtml(className)}</span>` +
      `<span class="subject">${escapeHtml(entry.subject)}</span>` +
      (entry.teacher ? `<span class="teacher">${escapeHtml(entry.teacher)}</span>` : '')
  );
}

function renderSubjectView() {
  if (!currentSubject) { renderEmptyMsg('Предметы не найдены.'); return; }
  renderGrid(
    (className, entry) => entry.subject === currentSubject,
    (className, entry) => `<span class="klass-tag">${escapeHtml(className)}</span>` +
      (entry.teacher ? `<span class="teacher">${escapeHtml(entry.teacher)}</span>` : '') +
      (entry.room ? `<span class="room">№${escapeHtml(entry.room)}</span>` : '')
  );
}

function renderTimeView() {
  document.getElementById('thead').innerHTML = TIME_THEAD;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const bucket = (scheduleData[currentDay] && scheduleData[currentDay][currentLesson]) ? scheduleData[currentDay][currentLesson] : {};
  const classNames = Object.keys(classMap);
  let any = false;
  classNames.forEach(className => {
    const entry = bucket[className];
    const tr = document.createElement('tr');
    if (entry && entry.subject) {
      any = true;
      tr.innerHTML = `<td><span class="klass-tag">${escapeHtml(className)}</span></td>` +
        `<td><span class="subject">${escapeHtml(entry.subject)}</span></td>` +
        `<td>${entry.teacher ? escapeHtml(entry.teacher) : '—'}</td>` +
        `<td>${entry.room ? '№' + escapeHtml(entry.room) : '—'}</td>`;
    } else {
      tr.innerHTML = `<td><span class="klass-tag">${escapeHtml(className)}</span></td>` +
        `<td class="empty">—</td><td class="empty">—</td><td class="empty">—</td>`;
    }
    tbody.appendChild(tr);
  });
  if (!any && classNames.length === 0) {
    tbody.innerHTML = `<tr class="loading-row"><td colspan="4">Нет данных для этого времени.</td></tr>`;
  }
}

function renderEmptyMsg(msg) {
  document.getElementById('thead').innerHTML = GRID_THEAD;
  document.getElementById('tbody').innerHTML = `<tr class="loading-row"><td colspan="7">${escapeHtml(msg)}</td></tr>`;
}

function render() {
  if (mode === 'class') renderClassView();
  else if (mode === 'teacher') renderTeacherView();
  else if (mode === 'room') renderRoomView();
  else if (mode === 'subject') renderSubjectView();
  else if (mode === 'time') renderTimeView();
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusText');
  dot.className = 'status-dot' + (state === 'live' ? ' live' : state === 'error' ? ' error' : '');
  label.textContent = text;
}
function showError(msg) {
  const banner = document.getElementById('errorBanner');
  banner.innerHTML = msg;
  banner.classList.add('show');
}
function hideError() { document.getElementById('errorBanner').classList.remove('show'); }

async function loadSchedule() {
  setStatus('loading', 'Обновляю данные из таблицы…');
  hideError();
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    teacherSet = new Set(); roomSet = new Set(); subjectSet = new Set();
    scheduleData = buildSchedule(rows);
    populateControls();
    render();
    const now = new Date();
    setStatus('live', 'Обновлено: ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }));
  } catch (err) {
    setStatus('error', 'Не удалось обновить');
    showError(
      'Не получилось загрузить данные из Google Таблицы напрямую в этом просмотрщике — так бывает в песочнице предпросмотра. ' +
      'Сохраните файл и откройте как обычную веб-страницу (например, через GitHub Pages), и загрузка будет работать в браузере.'
    );
  }
}

document.querySelectorAll('.mode-switch button').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.controls').forEach(c => c.classList.remove('active'));
    document.getElementById('ctrl-' + mode).classList.add('active');
    render();
  });
});

document.getElementById('classSelect').addEventListener('change', e => { currentClass = e.target.value; render(); });
document.getElementById('teacherInput').addEventListener('input', e => { currentTeacher = e.target.value.trim(); render(); });
document.getElementById('roomSelect').addEventListener('change', e => { currentRoom = e.target.value; render(); });
document.getElementById('subjectSelect').addEventListener('change', e => { currentSubject = e.target.value; render(); });
document.getElementById('daySelect').addEventListener('change', e => { currentDay = e.target.value; render(); });
document.getElementById('lessonSelect').addEventListener('change', e => { currentLesson = e.target.value; render(); });
document.getElementById('refreshBtn').addEventListener('click', loadSchedule);

loadSchedule();
setInterval(loadSchedule, 5 * 60 * 1000);
</script>
